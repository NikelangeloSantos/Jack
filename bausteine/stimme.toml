# Erzählerstimme für tools/vertonung.py (kein Geheimnis, darf ins Repo).
# API-Schlüssel NIE hier eintragen, nur in .env oder als Umgebungsvariable.
voice_id = "LRpNiUBlcqgIsKUzcrlN"   # Georg: deutsch, alt und rau (trockener Erzähler)

# Probe-Test 2026-11-05 (proben/): "Zombie-Apokalypse. Die ersten drei Tage entscheiden." (52 Zeichen)
#   eleven_v4: 3,9 s Sprechzeit, eleven_multilingual_v2 Tempo 1.0: 4,1 s -> Georg spricht ca. 13 Zeichen/s.
#   Gewählt: multilingual_v2 mit speed 1.1, weil nur dort das Tempo einstellbar ist und die Texte
#   sonst nicht in die Clips passen. eleven_v4 bleibt Alternative (Tags wie [sarcastic] möglich).
# Laut ElevenLabs-Doku (gelesen 2026-11-05):
#   eleven_v4              Audio-Tags wie [sarcastic] ja, KEIN speed/style, kein SSML
#   eleven_v3              Audio-Tags ja, kein SSML-<break>
#   eleven_multilingual_v2 KEINE Audio-Tags (Tags weglassen), speed 0.7-1.2, <break> geht
model_id = "eleven_multilingual_v2"

[voice_settings]
stability = 0.45         # etwas lebendiger für Georgs ironischen Ton (Folge 02, Überarbeitung)
similarity_boost = 0.75
style = 0.15             # leichte Betonung/Ironie; höher = übertriebener
speed = 1.15             # Georg spricht langsam (~13 Zeichen/s bei 1.0); nur multilingual_v2 / v3; wird bei eleven_v4 automatisch weggelassen
