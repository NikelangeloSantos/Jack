# Video 02 – Die ersten 3 Tage
# Quelle: Auftrag im Chat (2026-11-05). Sprechertexte, Reihenfolge, Icons, Texte und Anzeigen wörtlich vom Nutzer.
# Nur vorhandene Clips aus bibliothek/clips/ – keine neuen Flow-Clips.
#
# Bauen:     python3 tools/jack.py baue videos/02-die-ersten-3-tage
# Schneiden: python3 tools/schnitt.py videos/02-die-ersten-3-tage --plan     (dann ohne --plan)
# Vertonen:  erst nach Freigabe durch den Nutzer (Stimmtest Georg steht noch aus)

[video]
nummer = "02"
titel = "Die ersten 3 Tage"
nur_bibliothek = true
thema = "Grundvorrat für die ersten Tage einer Krise: Wasser, Essen ohne Kochen, Medikamente, Radio, Licht, Bargeld, Vorbereitung zu Hause."
lerneffekt = "Mindestens 3 Tage, besser 10 Tage vorsorgen: 2 Liter Wasser pro Person und Tag, Essen ohne Kochen, Medikamente und Erste-Hilfe-Material, Radio, Taschenlampe mit Ersatzbatterien, Bargeld, Nummern auf Papier, Dokumente griffbereit, mit Nachbarn absprechen."
ton = "trockener, rauer Erzähler, ruhig und klar"
referenzbild = "bibliothek/bilder/jack-observing-burning-city-4098f4a9-2k.jpg"
caption = "Zombie-Apokalypse: Was brauchst du für die ersten 3 Tage? Wichtig: 3 Tage sind das Minimum – besser ist ein Vorrat für 10 Tage (2 Liter Wasser pro Person und Tag). Quellen: BBK-Ratgeber „Vorsorgen für Krisen und Katastrophen“ und Landesportal Schleswig-Holstein. Was fehlt dir noch?"
hashtags = ["#zombieapokalypse", "#vorsorge", "#notvorrat", "#survival", "#krisenvorsorge"]
clip_min_tempo = 1.0   # Nutzer: Clips nicht verlangsamen; bei zu langem Text Kürzung vorschlagen
clip_ton = 0.35
vorlauf = 0.25

[[rechnung]]
beschreibung = "Wasser für 3 Tage"
ausdruck = "2 * 3"
ergebnis = 6
einheit = "Liter pro Person"
hinweis = "Szene 02: 'Sechs Liter pro Person' = 2 L/Tag × 3 Tage"

[[rechnung]]
beschreibung = "Wasser für 10 Tage (Beschreibung)"
ausdruck = "2 * 10"
ergebnis = 20
einheit = "Liter pro Person"
hinweis = "nur in der Beschreibung angedeutet ('besser 10 Tage')"

[[fakt]]
szene = "01"
text = "„Die ersten drei Tage entscheiden.“"
status = "offen"
notiz = "Zuspitzung für den Hook, keine Aussage der Quellen. Belegt ist nur: Vorrat mindestens für 3 Tage, besser für 10 Tage (SH-Landesportal; BBK-Ratgeber S. 2/6: 'Alle Haushalte sollten sich möglichst 10 Tage selbst versorgen können. Aber auch ein Vorrat für zumindest 3 Tage …'). Deshalb Hinweis auf 10 Tage in der Beschreibung."

[[fakt]]
szene = "02"
text = "Sechs Liter Wasser pro Person (für drei Tage)."
status = "geprueft"
quelle = "https://www.schleswig-holstein.de/DE/landesportal/kampagne/kommklarsh/vorraete (Stand 17.03.2026)"
beleg = "'Als Orientierung gelten 2 Liter pro Person und Tag.' … 'Für drei Tage sind das rund 6 Liter pro Person.' BBK-Ratgeber: 'Idealerweise 2 Liter pro Person und Tag.'"

[[fakt]]
szene = "02"
text = "Wasser zuerst / das Wichtigste."
status = "geprueft"
quelle = "BBK-Ratgeber 'Vorsorgen für Krisen und Katastrophen', 2. Aufl. 11/2025 (https://www.markt-triefenstein.de/wp-content/uploads/2026/01/BBK-Vorsorgen-fuer-Krisen-und-Katastrophen.pdf); SH-Landesportal"
beleg = "BBK: 'Trinkwasser ist sehr wichtig, wichtiger als Essen.' SH: 'Trinkwasser – noch wichtiger als Essen'"

[[fakt]]
szene = "03"
text = "Essen, das ohne Herd funktioniert."
status = "geprueft"
quelle = "BBK-Ratgeber (Essen und Trinken bevorraten); SH-Landesportal"
beleg = "BBK: 'Fertig. Essen, das nicht gekocht werden muss, ist essbar, auch wenn der Herd nicht mehr funktioniert.' SH: 'Fertig: Essen, das nicht gekocht werden muss, ist essbar. Auch, wenn der Herd nicht mehr funktioniert.'"

[[fakt]]
szene = "03"
text = "„Chips zählen nur knapp. Besser: Konserven.“"
status = "offen"
notiz = "Wertung/Gag, nicht wörtlich belegt. Die Quellen nennen Kriterien (haltbar, ohne Kühlung, ohne Kochen) – Chips erfüllen sie formal, Konserven auch. 'Konserven' steht nicht wörtlich in den Quellen, passt aber zu 'Haltbar' und 'Fertig'."

[[fakt]]
szene = "03"
text = "Dosenöffner."
status = "geprueft"
quelle = "BBK-Ratgeber, Checkliste Notgepäck"
beleg = "'Taschenmesser und Dosenöffner'"

[[fakt]]
szene = "04"
text = "Persönliche Medikamente und Erste-Hilfe-Material."
status = "geprueft"
quelle = "BBK-Ratgeber (Hausapotheke; Checklisten)"
beleg = "'Persönliche Medikamente … nach individuellem Bedarf'; 'Material zur Wundversorgung, zum Beispiel Pflaster und Mullbinden'; Checkliste Notgepäck: 'Erste-Hilfe-Material', 'Persönliche Medikamente'"

[[fakt]]
szene = "05"
text = "Fallen Internet und Mobilfunk aus, funktionieren Warn-Apps nicht mehr, Radiosender aber schon."
status = "geprueft"
quelle = "BBK-Ratgeber (Informieren/Warnung)"
beleg = "'Wenn Mobilfunknetz und Internet nicht mehr funktionieren, fallen auch Warn-Apps oder Handy-Warnungen aus. Radiosender funktionieren aber auch dann noch. Daher ist ein Radio in Notfällen und Krisen wichtig.'"
notiz = "Bei Stromausfall laut BBK: 'Auto- oder Kurbelradios sowie batteriebetriebene Radios'."

[[fakt]]
szene = "06"
text = "Taschenlampe mit Ersatzbatterien."
status = "geprueft"
quelle = "BBK-Ratgeber, Checkliste 'Licht und Wärme'"
beleg = "'Taschenlampe und Ersatzbatterien'"

[[fakt]]
szene = "06"
text = "Bargeld, denn ohne Strom gehen Kartenzahlung und Geldautomat nicht."
status = "geprueft"
quelle = "BBK-Ratgeber, Abschnitt 'Wenn der Alltag unterbrochen wird' (Zahlungsverkehr); Checkliste: 'Bargeld'"
beleg = "'Ohne Strom oder IT-Systeme fallen elektronische Zahlungssysteme aus. Abhebungen an Bankautomaten und das Bezahlen per Karte oder Handy funktionieren nicht mehr.'"

[[fakt]]
szene = "07"
text = "Wichtige Nummern auf Papier schreiben."
status = "geprueft"
quelle = "BBK-Ratgeber, Checkliste 'Information/Kommunikation'"
beleg = "'Liste wichtiger Telefonnummern auf Papier'"

[[fakt]]
szene = "07"
text = "Dokumente griffbereit legen."
status = "geprueft"
quelle = "BBK-Ratgeber, Abschnitt 'Dokumente sicher aufbewahren'"
beleg = "'Wenn Sie das Haus plötzlich verlassen müssen, sollten Sie wichtige Dokumente griffbereit haben.'"

[[fakt]]
szene = "07"
text = "Mit den Nachbarn absprechen."
status = "geprueft (sinngemäß)"
quelle = "BBK-Ratgeber, 'Das können Sie noch tun'"
beleg = "'Sprechen Sie mit Ihrem Umfeld (Nachbarschaft, Familie, Freundeskreis) darüber, wie man Sie in einer Notsituation unterstützen kann.'"

