# Themen-Datei fuer Video {{NUMMER}}. Ausfuellen, dann:
#   python3 tools/jack.py baue videos/{{NUMMER}}-{{SLUG}}
#
# Texte fuers Video (sprechertext, einblendtext): Deutsch. Flow-Felder (scene, action, camera, mood, expression): Englisch.
# Aufbau (teil): hook, falscher_plan, fakt, eskalation, schluss  (Schluss endet mit Frage an die Zuschauer)
# camera / mood / expression: Name aus bausteine/bausteine.toml ([kamera], [stimmung], [mimik]) ODER eigener Satz.
# booster: hoechstens 1 Name aus [booster]. korrektur: nur wenn ein Clip genau diesen Fehler hatte.
# Prompt-Regeln: pro Clip eine Hauptaktion; Startzustand beschreiben (leerer Wagen, wenn er erst gefuellt wird);
#   keine Ziffern, kein Text, keine Marken; lebendige Kamera, keine feste Kamera als Standard.
# chance = Pflicht in jeder Szene (0-100), wird im Schnitt als "Überlebenschance: X %" eingeblendet.
# popup = Icons, die im Schnitt genau beim gesprochenen Wort erscheinen (Namen: bausteine [icons]).

