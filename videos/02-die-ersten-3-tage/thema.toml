# Video 02 – Die ersten 3 Tage (Überarbeitung 2)
# Auftrag 1 (2026-11-05): Szenen, Clips, Icons, Anzeigen vom Nutzer.
# Auftrag 2: "überarbeite alle Fehler und synchronisiere die Stimme und das Ende passend zum Material,
#            humorvolle Erzählerstimme von Georg" -> Texte neu auf die Clips geschrieben (trocken-ironisch),
#            Wörter per `anker` auf die Bildmomente gelegt, Schlussclip vor dem Klemmbrett-Fehler beendet.
# Nur vorhandene Clips aus bibliothek/clips/ – keine neuen Flow-Clips.
#
# Bauen:     python3 tools/jack.py baue videos/02-die-ersten-3-tage
# Vertonen:  python3 tools/vertonung.py videos/02-die-ersten-3-tage --neu      (fragt, kostet Guthaben)
# Schneiden: python3 tools/schnitt.py videos/02-die-ersten-3-tage --plan     (dann ohne --plan)

[video]
nummer = "02"
titel = "Die ersten 3 Tage"
nur_bibliothek = true
thema = "Grundvorrat für die ersten Tage einer Krise: Wasser, Essen ohne Kochen, Medikamente, Radio, Licht, Bargeld, Vorbereitung zu Hause."
lerneffekt = "Mindestens 3 Tage, besser 10 Tage vorsorgen: 2 Liter Wasser pro Person und Tag, Essen ohne Kochen, Medikamente und Erste-Hilfe-Material zu Hause, Radio, Taschenlampe, Bargeld, Nummern auf Papier, Dokumente griffbereit, Nachbarn einbeziehen."
ton = "Georg: trocken, ironisch, Understatement – kommentiert Jacks Entscheidungen wie ein müder Naturfilmer"
referenzbild = "bibliothek/bilder/jack-observing-burning-city-4098f4a9-2k.jpg"
caption = "Zombie-Apokalypse: Was brauchst du für die ersten 3 Tage? Wichtig: 3 Tage sind das Minimum – besser ist ein Vorrat für 10 Tage (2 Liter Wasser pro Person und Tag). Quellen: BBK-Ratgeber „Vorsorgen für Krisen und Katastrophen“ und Landesportal Schleswig-Holstein. Was fehlt dir noch?"
hashtags = ["#zombieapokalypse", "#vorsorge", "#notvorrat", "#survival", "#krisenvorsorge"]
clip_min_tempo = 1.0     # Clips nie verlangsamen
clip_ton = 0.35
vorlauf = 0.25
max_ueberhang = 0.3      # Stimme bleibt in ihrer Szene; nur ein Wortende darf kurz über den Schnitt
schluss_nachlauf = 0.3

[[rechnung]]
beschreibung = "Wasser für 3 Tage"
ausdruck = "2 * 3"
ergebnis = 6
einheit = "Liter pro Person"
hinweis = "Szene 02: 'Sechs Liter pro Person' = 2 L/Tag × 3 Tage (Einblendung nennt die 3 Tage)"

[[rechnung]]
beschreibung = "Wasser für 10 Tage (Beschreibung)"
ausdruck = "2 * 10"
ergebnis = 20
einheit = "Liter pro Person"
hinweis = "nur in der Beschreibung ('besser 10 Tage')"

[[fakt]]
szene = "02"
text = "Wasser zuerst; sechs Liter pro Person (für drei Tage)."
status = "geprueft"
quelle = "https://www.schleswig-holstein.de/DE/landesportal/kampagne/kommklarsh/vorraete (Stand 17.03.2026); BBK-Ratgeber 'Vorsorgen für Krisen und Katastrophen', 2. Aufl. 11/2025"
beleg = "SH: 'Trinkwasser – noch wichtiger als Essen' … 'Als Orientierung gelten 2 Liter pro Person und Tag.' … 'Für drei Tage sind das rund 6 Liter pro Person.' BBK: 'Trinkwasser ist sehr wichtig, wichtiger als Essen.'"

[[fakt]]
szene = "03"
text = "Essen, das ohne Herd geht; besser Konserven, dazu ein Dosenöffner."
status = "geprueft (sinngemäß)"
quelle = "BBK-Ratgeber (Essen und Trinken bevorraten; Checkliste Notgepäck); SH-Landesportal"
beleg = "BBK/SH: 'Fertig: Essen, das nicht gekocht werden muss, ist essbar, auch wenn der Herd nicht mehr funktioniert.' BBK: 'Taschenmesser und Dosenöffner'."
notiz = "'Konserven' steht nicht wörtlich in den Quellen, erfüllt aber die Kriterien haltbar/fertig. 'Chips. Mutig.' ist ein Gag, keine Sachaussage."

[[fakt]]
szene = "04"
text = "Medikamente und Erste-Hilfe-Material am besten schon zu Hause haben."
status = "geprueft"
quelle = "BBK-Ratgeber (Hausapotheke)"
beleg = "'In einer Krise … kann es sein, dass der Rettungsdienst, Krankenhäuser und Apotheken vorübergehend nicht verfügbar sind. Daher ist es sinnvoll, wichtige Medikamente zuhause zu haben.' Hausapotheke: 'Persönliche Medikamente', 'Material zur Wundversorgung, zum Beispiel Pflaster und Mullbinden'."

[[fakt]]
szene = "05"
text = "Ohne Netz schweigen Warn-Apps, Radiosender nicht."
status = "geprueft (sinngemäß)"
quelle = "BBK-Ratgeber (Informieren)"
beleg = "'Wenn Mobilfunknetz und Internet nicht mehr funktionieren, fallen auch Warn-Apps oder Handy-Warnungen aus. Radiosender funktionieren aber auch dann noch.'"
notiz = "'Netz' = Mobilfunknetz und Internet."

[[fakt]]
szene = "06"
text = "Liste: Wasser, Konserven, Erste Hilfe, Radio, Taschenlampe, Bargeld – Karten brauchen Strom."
status = "geprueft (sinngemäß)"
quelle = "BBK-Ratgeber (Checklisten; 'Wenn der Alltag unterbrochen wird' – Zahlungsverkehr)"
beleg = "Checkliste: Trinkwasser, haltbare Lebensmittel, Erste-Hilfe-Material, Radio, 'Taschenlampe und Ersatzbatterien', 'Bargeld'. Zahlungsverkehr: 'Ohne Strom oder IT-Systeme fallen elektronische Zahlungssysteme aus. Abhebungen an Bankautomaten und das Bezahlen per Karte oder Handy funktionieren nicht mehr.'"
notiz = "Ersatzbatterien und Geldautomat aus Zeitgründen nicht mehr gesprochen."

[[fakt]]
szene = "07"
text = "Nummern auf Papier, Dokumente griffbereit, Nachbarn fragen."
status = "geprueft (sinngemäß)"
quelle = "BBK-Ratgeber (Checkliste Information; 'Dokumente sicher aufbewahren'; 'Das können Sie noch tun')"
beleg = "'Liste wichtiger Telefonnummern auf Papier'; 'sollten Sie wichtige Dokumente griffbereit haben'; 'Sprechen Sie mit Ihrem Umfeld (Nachbarschaft, Familie, Freundeskreis) darüber, wie man Sie in einer Notsituation unterstützen kann.'"

