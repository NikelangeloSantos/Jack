# Video 01 – Der Chips-Einkauf
# Quelle: Auftrag im Chat vom 2026-11-05. Sprechertexte, Anzeigen und Clip-Ideen wörtlich vom Nutzer.
#
# Bauen:     python3 tools/jack.py baue videos/01-der-chips-einkauf
# Vertonen:  python3 tools/vertonung.py videos/01-der-chips-einkauf          (zeigt Zeichenzahl, fragt vorher)
# Schneiden: python3 tools/schnitt.py videos/01-der-chips-einkauf --plan     (dann ohne --plan)

[video]
nummer = "01"
titel = "Der Chips-Einkauf"
thema = "Wasservorrat für den Notfall: Ohne Strom kann auch das Leitungswasser ausfallen."
lerneffekt = "Trinkwasser vorrätig haben: 2 Liter pro Person und Tag, mindestens für 3 Tage, besser für 10. Dazu Konserven, Medikamente, Radio, Taschenlampe, Bargeld."
ton = "trockener, rauer Erzähler, Understatement; Jack macht die Fehler"
referenzbild = "bibliothek/bilder/jack-observing-burning-city-4098f4a9-2k.jpg"
caption = "Zombie-Apokalypse, Tag eins: Jack kauft nur Chips. Was fehlt in deinem Vorrat? 💧"
hashtags = ["#zombieapokalypse", "#vorsorge", "#notvorrat", "#survival", "#wasser"]
# Schnitt
clip_ton = 0.35        # Lautstärke des Flow-Tons (wird unter der Stimme zusätzlich abgesenkt)
vorlauf = 0.25         # Sekunden Bild vor dem Einsatz der Stimme (Hook: siehe Szene 1)

[[rechnung]]
beschreibung = "Wasser für 10 Tage"
ausdruck = "2 * 10"
ergebnis = 20
einheit = "Liter pro Person"
hinweis = "Szene 04"

[[rechnung]]
beschreibung = "Wasser für 3 Tage (Mindestvorrat)"
ausdruck = "2 * 3"
ergebnis = 6
einheit = "Liter pro Person"
hinweis = "Szene 06 'sechs Liter Wasser pro Person' = Mindestvorrat für 3 Tage"

[[fakt]]
szene = "04"
text = "Empfohlen sind zwei Liter Trinkwasser pro Person und Tag."
status = "geprueft"
quelle = "https://www.schleswig-holstein.de/DE/landesportal/kampagne/kommklarsh/vorraete (Stand 17.03.2026); BBK-Ratgeber 'Vorsorgen für Krisen und Katastrophen', 2. Aufl. 11/2025, S. 6"
beleg = "SH: 'Als Orientierung gelten 2 Liter pro Person und Tag.' BBK: 'Idealerweise 2 Liter pro Person und Tag.'"

[[fakt]]
szene = "04"
text = "Vorrat für zehn Tage (als Ziel)."
status = "geprueft"
quelle = "https://www.schleswig-holstein.de/DE/landesportal/kampagne/kommklarsh/vorraete; BBK-Ratgeber S. 2"
beleg = "SH: 'Ihr Vorrat sollte mindestens für drei Tage reichen, besser noch für 10 Tage.' BBK: 'möglichst 10 Tage selbst versorgen'"

[[fakt]]
szene = "03"
text = "Ohne Strom stehen irgendwann auch die Pumpen still (Leitungswasser fällt aus)."
status = "geprueft (sinngemäß)"
quelle = "https://www.bbk.bund.de/SharedDocs/Downloads/DE/Mediathek/Publikationen/Buergerinformationen/Ratgeber/BBK-Vorsorgen-fuer-Krisen-und-Katastrophen.pdf (2. Aufl. 11/2025, S. 4); https://www.bbk.bund.de/DE/Warnung-Vorsorge/Vorsorge/Stromausfall/stromausfall_node.html; https://www.schleswig-holstein.de/DE/landesportal/kampagne/kommklarsh/vorraete"
beleg = "BBK-Ratgeber: 'Wasserwerke benötigen Strom und digitale Systeme. Ohne sie fällt die Wasserversorgung aus.' BBK Stromausfall: 'Es kommt kein Wasser mehr aus der Leitung.' SH: 'Wasserwerke benötigen sowohl Elektrizität als auch digitale Steuerung. Fällt beides aus, ist auch die Wasserversorgung gefährdet.'"
notiz = "Die Quellen sagen 'Wasserwerke', nicht wörtlich 'Pumpen'. 'Irgendwann' passt (Ausfall nicht sofort). Wörtlich belegbar wäre: 'Ohne Strom steht irgendwann auch das Wasserwerk still.' Entscheidung beim Nutzer."

[[fakt]]
szene = "06"
text = "Sechs Liter Wasser pro Person (= Mindestvorrat für drei Tage)."
status = "geprueft"
quelle = "https://www.schleswig-holstein.de/DE/landesportal/kampagne/kommklarsh/vorraete"
beleg = "SH: 'Für drei Tage sind das rund 6 Liter pro Person.'"
notiz = "Im Sprechertext fehlt 'für drei Tage'. Ohne den Zusatz klingt es, als reichten 6 Liter insgesamt – Szene 04 nennt 20 Liter für 10 Tage. Vorschlag: 'mindestens sechs Liter Wasser pro Person' oder Einblendung '6 L = 3 Tage'. Entscheidung beim Nutzer (Einblendung ist gesetzt)."

[[fakt]]
szene = "06"
text = "Konserven / haltbare Lebensmittel, persönliche Medikamente, Radio, Taschenlampe, Bargeld gehören in den Vorrat."
status = "geprueft"
quelle = "BBK-Ratgeber 'Vorsorgen für Krisen und Katastrophen', 2. Aufl. 11/2025 (auch unter https://www.markt-triefenstein.de/wp-content/uploads/2026/01/BBK-Vorsorgen-fuer-Krisen-und-Katastrophen.pdf)"
beleg = "Checkliste: 'Haltbare Lebensmittel', 'Solar- oder batteriebetriebenes Radio inkl. Batterien oder Kurbelradio', 'Taschenlampe und Ersatzbatterien', 'Persönliche Medikamente', 'Bargeld'."

